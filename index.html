
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProjectMate - Nigerian Student Project Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .academic-font {
        font-family: 'Tinos', 'Times New Roman', serif;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
        border: 2px solid #f1f5f9;
      }
      
      /* Word Online Formatting */
      .ql-container.ql-snow {
        border: none !important;
      }
      .ql-editor {
        font-family: 'Tinos', 'Times New Roman', serif !important;
        font-size: 12pt !important;
        line-height: 2.0 !important;
        padding: 0 !important;
        min-height: 297mm;
        text-align: justify;
        color: #1e293b;
      }
      
      .ql-editor p {
        margin-bottom: 0 !important;
        text-indent: 0.5in;
      }
      
      .ql-editor h3 {
        text-align: center;
        text-transform: uppercase;
        font-weight: bold;
        font-size: 14pt !important;
        margin: 2em 0 !important;
        text-indent: 0 !important;
      }

      /* Ribbon Styling */
      .ql-snow .ql-picker.ql-header .ql-picker-label::before {
        content: 'Style' !important;
      }
      .ql-snow .ql-picker.ql-font .ql-picker-label::before {
        content: 'Font' !important;
      }
      
      /* Visual Page Breaks */
      .page-break-marker {
        position: absolute;
        left: 0;
        right: 0;
        height: 0;
        border-top: 1px dotted #cbd5e1;
        pointer-events: none;
        z-index: 5;
      }
      .page-break-marker::after {
        content: "PAGE BREAK";
        position: absolute;
        right: 10px;
        top: -10px;
        background: white;
        padding: 0 10px;
        font-size: 9px;
        font-weight: 800;
        color: #94a3b8;
        letter-spacing: 0.1em;
      }
    </style>

    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",

}
